services:
  - type: web
    name: cv-redactor
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt --no-cache-dir
    startCommand: gunicorn --workers 1 --threads 1 --timeout 120 --max-requests 50 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: UPLOAD_WORKER_COUNT
        value: 0
      - key: LLM_MAX_CONCURRENT_REQUESTS
        value: 1
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: WEB_CONCURRENCY
        value: 1
