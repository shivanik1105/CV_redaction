services:
  - type: web
    name: cv-redactor
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 2 --timeout 120 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: UPLOAD_WORKER_COUNT
        value: 1
      - key: LLM_MAX_CONCURRENT_REQUESTS
        value: 1
      - key: PYTHON_VERSION
        value: 3.11.0
